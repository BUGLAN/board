[package]
name = "board-desktop"
description = "Board 桌面端：打开线上的 Board，与网页端使用同一套界面和登录"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "board_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs 在缺少 sidecar（scripts/build-sidecar.mjs 的产物）时改 TAURI_CONFIG，去掉 bundle.externalBin
serde_json.workspace = true

[dependencies]
# tray-icon：「让这台电脑接任务」时关掉窗口留在后台，从托盘图标重新打开或退出
tauri = { version = "2", features = ["tray-icon"] }
# 配置文件 ~/.board/config.toml 的读写和机器名、白板路径校验，与 board 命令行共用一份
board-core = { workspace = true, features = ["config"] }
serde.workspace = true
serde_json.workspace = true
# 连接服务端页 / 切换服务端前校验 GET <地址>/api/health（和 board 命令行同一个 HTTP 库）
ureq = "3"
# GitHub 登录：在系统默认浏览器里打开登录页
open = "5"
getrandom = "0.3"
# 「让这台电脑接任务」、改白板目录前弹系统确认框（只在 Rust 一侧用，页面调不到）
tauri-plugin-dialog = "2"
# Windows / Linux：关窗口后程序留在托盘，再点图标只把已有窗口带到前面，不起第二个进程
tauri-plugin-single-instance = "2"
# 检查更新：从发版附件里的 latest.json 找新版本，下载的安装包用公钥验签（见 update.rs）。
# 不用它自己的页面命令，只在 Rust 一侧用，命令由 update.rs 自己定义（带进度事件和版本校验）
tauri-plugin-updater = "2"
