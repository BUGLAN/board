[package]
name = "board-desktop"
description = "Board 桌面端：打开线上的 Board，与网页端使用同一套界面和登录"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "board_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：「让这台电脑接任务」时关掉窗口留在后台，从托盘图标重新打开或退出
tauri = { version = "2", features = ["tray-icon"] }
# 配置文件 ~/.board/config.toml 的读写和机器名、白板路径校验，与 board 命令行共用一份
board-core = { workspace = true, features = ["config"] }
serde.workspace = true
serde_json.workspace = true
# GitHub 登录：在系统默认浏览器里打开登录页
open = "5"
getrandom = "0.3"
# 「让这台电脑接任务」、改白板目录前弹系统确认框（只在 Rust 一侧用，页面调不到）
tauri-plugin-dialog = "2"
# Windows / Linux：关窗口后程序留在托盘，再点图标只把已有窗口带到前面，不起第二个进程
tauri-plugin-single-instance = "2"
