[package]
name = "board-desktop"
description = "Board 桌面端：打开线上的 Board，与网页端使用同一套界面和登录"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "board_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：「让这台电脑接任务」时关掉窗口留在后台，从托盘图标重新打开或退出
tauri = { version = "2", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
# GitHub 登录：在系统默认浏览器里打开登录页
open = "5"
getrandom = "0.3"
toml_edit = "0.25"
