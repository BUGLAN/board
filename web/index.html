<!doctype html>
<html lang="zh-CN" data-shell="web">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0D0F" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F0EB" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="light dark">
<title>Board</title>
<!-- 手机上「添加到主屏幕」：像应用一样单独打开，没有浏览器的地址栏。图标由 scripts/build-icons.py 生成（web/public/icons）；
     iOS 不读 manifest 里的图标，用 apple-touch-icon。不注册 service worker：不做离线，界面始终取最新的 -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Board">
<!-- 首帧就按主题上底色：主题偏好存在 localStorage，样式和脚本包还没加载时页面也不是白的（桌面端从启动页跳过来、慢网都不闪白）。
     与 lib/platform.ts 的 setTheme、styles/tokens.css 的 --bg 一致 -->
<!-- 不写内联脚本：页面的 CSP（board-server 的 CSP）只允许同源的脚本文件 -->
<script src="/theme.js"></script>
<style>
html { background: var(--bg, #F2F0EB); color-scheme: light; }
@media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: var(--bg, #0C0D0F); color-scheme: dark; } }
html[data-theme="dark"] { background: var(--bg, #0C0D0F); color-scheme: dark; }
/* iOS 主屏安装版顶部的系统级模糊（default/main#627）：iOS 26 起不认 theme-color，iOS 27 又在已安装 PWA 的顶部叠一层模糊、往下盖住顶栏。
   贴顶铺一条实色 fixed 层，iOS 就拿它当状态栏底色、不再画模糊（要 fixed、贴顶、宽 ≥80%、高 ≥6px、实色）。
   写成 body 里真实的元素、样式放在这里：首帧就在，不等样式包、不靠伪元素（原来的 body::before 首次打开认不到，滚一下才好）；
   启动、切回前台时 lib/iosTopBar.ts 再让它动一下，iOS 重新认一次。
   只在 iOS（-webkit-touch-callout 只有 iOS 的 WebKit 认）的 standalone 下出现：Safari 里打开、Android、桌面都不受影响。
   顶栏让出安全区（styles/layout.css 的 .app、.topbar），这一层只盖状态栏，不压 logo 和按钮 */
.ios-top { display: none; }
@media (display-mode: standalone) {
  @supports (-webkit-touch-callout: none) {
    .ios-top {
      display: block; position: fixed; inset: 0 0 auto 0; z-index: 30;
      height: max(6px, env(safe-area-inset-top, 0px));
      background: var(--bg, #F2F0EB); /* 和页面底色一致，跟着主题变；不用渐变、半透明 */
      pointer-events: none;
    }
    .ios-top.is-nudge { height: calc(max(6px, env(safe-area-inset-top, 0px)) + 1px); }
    @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) .ios-top { background: var(--bg, #0C0D0F); } }
    html[data-theme="dark"] .ios-top { background: var(--bg, #0C0D0F); }
  }
}
</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Crect x='6' y='8' width='4' height='16' rx='2' fill='%238F9AB4'/%3E%3Crect x='12' y='8' width='4' height='11' rx='2' fill='%23FF9A3C'/%3E%3Crect x='18' y='8' width='4' height='7' rx='2' fill='%234DB5FF'/%3E%3Crect x='24' y='8' width='4' height='13' rx='2' fill='%233DDC97'/%3E%3C/svg%3E">
</head>
<body>
<div class="ios-top" aria-hidden="true"></div>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
