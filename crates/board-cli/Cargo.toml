[package]
name = "board-cli"
description = "Board 命令行：agent 通过它读写白板（PRD §9）"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "board"
path = "src/main.rs"

[dependencies]
board-core = { workspace = true, features = ["config"] }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
unicode-width = "0.2"
ureq = { version = "3", features = ["json"] }

[target.'cfg(unix)'.dependencies]
# board host 结束 agent 进程树（kill 进程组）、处理 Ctrl+C / SIGTERM
libc = "0.2"

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
board-server.workspace = true
