[package]
name = "board-cli"
description = "Board 命令行：agent 通过它读写白板（PRD §9）"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "board"
path = "src/main.rs"

[dependencies]
board-core.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
toml_edit = "0.25"
unicode-width = "0.2"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
board-server.workspace = true
