[package]
name = "board-core"
description = "Board 的数据与规则：SQLite 存储、卡片规则引擎（PRD §8）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono.workspace = true
# 大盘按浏览器传来的 IANA 时区分桶；时区数据打包进可执行文件，不依赖系统的 zoneinfo
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
# 配置文件 ~/.board/config.toml 的读写（config 模块）：CLI 和桌面端用，服务端不带
toml_edit = { version = "0.25", optional = true }

[features]
config = ["dep:toml_edit"]

[dev-dependencies]
tempfile = "3"
