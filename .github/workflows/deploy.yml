# 测试与部署（docs/deploy.md「自动部署」）：
#   push main   → test：npm ci → cargo test → 界面类型检查 → 界面单元测试；不部署
#               → heartbeat-windows：在 Windows 上跑 board heartbeat 的测试（启动不卡死、agent 退出后停下、stop 发 final），
#                 多行正文经过 skill 入口 board.cmd 一字不丢（tests/multiline.rs），以及桌面端的单元测试（cargo test -p board-desktop）
#   push tag v*  → skill：在 macOS 上编各平台的 board，放进 skill 的 bin/，打包 board-skills.zip 和单独的 board 包（和 build、deploy 同时跑）
#                → desktop：在 macOS、Windows 上构建桌面端安装包（macOS 通用 .dmg；Windows NSIS .exe、.msi 和免安装便携 .zip），
#                  带更新签名（TAURI_SIGNING_PRIVATE_KEY）构建，拼出更新清单 latest.json（桌面端的「检查更新」读它），和 build、deploy 同时跑
#                → build：核对 tag、Cargo.toml 的 workspace 版本号和 CHANGELOG.md → 构建界面、cargo test、交叉编译 board-server、prebuilt 镜像推到 GHCR
#                → deploy：SSH 到服务器备份、拉镜像、改 .env 的 BOARD_IMAGE、重启，核对线上版本号和提交号；失败切回上一个镜像
#                → release：用 CHANGELOG.md 里这一版的段落建 GitHub Release，附上 board-skills.zip、单独的 board 包（board-<平台>.tar.gz / .zip、
#                  board-sha256.txt）、桌面端安装包、更新包和 latest.json
#                  （任一平台的安装包没构建出来、或更新清单缺平台，就不建 Release，不留残缺的附件；服务端照常部署）
# tag 由 npm run release 打（scripts/release.mjs：改版本号、生成 changelog、提交、打 tag）
# 手动运行（在 main 上）填 7 位提交号：跳过 build，直接部署 GHCR 上已有的镜像（回滚用）
name: deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
    # 推 main 时改动全部在这些路径里不跑测试（推 tag 不看路径）
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      commit:
        description: "要回滚到的 7 位提交号：跳过构建，直接部署 GHCR 上已有的镜像"
        required: true

# 部署同一时间只有一次：后来的排队，不取消正在进行的；测试另排一队
concurrency:
  group: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && 'deploy' || 'test' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/buglan/board-server

jobs:
  # 推 main：只跑推送前检查（和 AGENTS.md 一致），不构建镜像、不部署
  test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # 用固定的共享 key 取代按任务名的 key，让 tag 上的 build 能读到 main 上 test 保存的缓存
          shared-key: board

      - name: 安装依赖（postinstall 会装 web/ 的依赖）
        run: npm ci

      - name: 测试
        run: cargo test --locked

      - name: 界面类型检查
        run: npm --prefix web run typecheck

      - name: 界面单元测试
        run: npm --prefix web test

      # 发版时才生成真正的 latest.json；这里用假签名拼一份，核对结构、平台键、地址，以及写坏的清单会被拦下
      - name: 更新清单脚本（dry-run）
        run: node scripts/updater-manifest.mjs --dry-run

      # 命令行版 board 的安装脚本（服务端 /install.sh 提供）：ubuntu 镜像自带 shellcheck；平台判断、校验失败中止的用例在 cargo test 里
      - name: 安装脚本 shellcheck
        run: shellcheck -s sh scripts/install.sh

  # 推 main：后台心跳在 Windows 上的行为（tests/heartbeat.rs）、多行正文经过 board.cmd（tests/multiline.rs），Linux 上的已经在 test 里跑过；
  # 桌面端（src-tauri）的单元测试也在这里跑：cargo test 默认不编桌面端，Linux 上还要装 GTK、WebKitGTK 这些系统依赖
  heartbeat-windows:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # 用固定的共享 key 取代按任务名的 key，让 tag 上的 build 能读到 main 上 test 保存的缓存
          shared-key: board

      - name: board heartbeat、多行正文经过 board.cmd 的测试
        run: cargo test --locked -p board-cli --test heartbeat --test agents --test multiline

      # 桌面端的测试（src-tauri/src 下的 31 个用例：ACL、路径校验、更新、登录等）。不需要先编安装包自带的 board：
      # src-tauri/build.rs 在 src-tauri/binaries 里没有 sidecar 时按不带 sidecar 构建
      - name: 桌面端单元测试
        run: cargo test --locked -p board-desktop

  # 推 v* tag：编各平台的 board 放进 skill 目录，打包成 board-skills.zip；同时打出单独的 board 包（每个平台一个压缩包，
  # 附 SHA-256 校验文件 board-sha256.txt），release 时都附上——安装脚本（/install.sh、/install.ps1）和 board update 下载它们
  skill:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # 用固定的共享 key 取代按任务名的 key，让 tag 上的 build 能读到 main 上 test 保存的缓存
          shared-key: board

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.13.0

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-zigbuild

      - name: 编各平台的 board，打包 skill
        run: node scripts/build-skill-bin.mjs --zip

      - uses: actions/upload-artifact@v4
        with:
          name: board-skills
          path: target/board-skills.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: board-cli
          path: target/board-dist/
          if-no-files-found: error

  # 推 v* tag：从 tag 对应的提交构建桌面端安装包（界面 + 自带的 board 命令行），release 时附上。
  # Windows 另打免安装的便携版 .zip（绿色版：解压即用，不带 WebView2 引导，docs/deploy.md「桌面端安装包」）
  # 不签名、不公证：macOS 用 ad-hoc 签名（Apple Silicon 上才能运行），第一次打开要在「隐私与安全性」里放行（docs/deploy.md「桌面端安装包」）
  desktop:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      # 一个平台失败不取消另一个，日志都留着；release 需要两个都成功
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            # app：更新包（Board.app.tar.gz）从 .app 打出来，只打 dmg 时 Tauri 不出更新包
            bundles: app,dmg
            files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
            files: |
              target/x86_64-pc-windows-msvc/release/bundle/*.zip
              target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 核对 tag 和 tauri.conf.json 的版本号
        shell: bash
        run: |
          tag=${GITHUB_REF_NAME#v}
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME 和 src-tauri/tauri.conf.json 的版本号（${ver}）不一致。用 npm run release -- $tag 发版"
            exit 1
          fi

      # 更新包要用私钥签名：仓库没配 secret 时 GitHub 给的是空字符串，tauri build 打完包才报
      # 「failed to decode secret key」。在编译之前就拦下，省掉十几分钟的构建，并说清楚要配什么
      - name: 核对更新签名私钥
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::仓库没有配 secret TAURI_SIGNING_PRIVATE_KEY（更新包的签名私钥），桌面端不打包、不建 Release。配置方法见 docs/deploy.md「桌面端检查更新」的一次性配置"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: board-desktop

      - name: 安装依赖（postinstall 会装 web/ 的依赖）
        run: npm ci

      # 编 board 放进 src-tauri/binaries（通用包时编两个架构再 lipo）。beforeBuildCommand 还会再跑一次，已经编好的不重编
      - name: 编安装包自带的 board
        run: node scripts/build-sidecar.mjs
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}

      # 桌面端的单元测试（src-tauri/src 下的 31 个用例）：macOS、Windows 各跑一次，和安装包同一个缓存、编过的依赖不用再编
      - name: 桌面端单元测试
        run: cargo test --locked -p board-desktop

      # beforeBuildCommand 构建界面。bundle.createUpdaterArtifacts：每个平台的更新包和它的 .sig 放在安装包旁边
      # （macOS：bundle/macos/Board.app.tar.gz；Windows：bundle/nsis/<安装包>.exe），下面按平台键收进 updater/<平台键>/
      - name: 构建安装包
        run: npx tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          # 官方安装包连的服务端（GitHub Variable DEPLOY_URL，例如 https://board.example.com；没配时为空：
          # 桌面端第一次打开显示「连接服务端」页）。代码里不写死地址，见 docs/deploy.md「自己部署的桌面端」
          BOARD_DEFAULT_URL: ${{ vars.DEPLOY_URL }}
          # macOS：ad-hoc 签名；Windows 上不用
          APPLE_SIGNING_IDENTITY: "-"
          # 更新包的签名私钥：只在仓库 secret 里，不进仓库；客户端只认 tauri.conf.json 里的公钥
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 把更新包和签名按平台键收齐，给下面的清单用：updater/<darwin|windows>-<arch>[-<bundle>]/<文件> 和 .sig
      - name: 收齐更新包和签名
        shell: bash
        run: |
          set -euo pipefail
          rel="target/${{ matrix.target }}/release/bundle"
          ver=${GITHUB_REF_NAME#v}
          # 更新包和签名都得在：没有签名的更新包客户端不装，宁可这次不建 Release
          need() { [ -n "${1}" ] && [ -f "${1}" ] && [ -f "${1}.sig" ] || { echo "::error::${2}：${1:-没有找到}"; ls -R "${rel}" || true; exit 1; }; }
          if [ "$RUNNER_OS" = macOS ]; then
            f=$(find "${rel}/macos" -maxdepth 1 -type f -name "*.app.tar.gz" 2>/dev/null | head -1)
            need "${f}" "没有 macOS 更新包（.app.tar.gz 和 .sig）：bundles 里要有 app，构建时要有签名私钥"
            # 通用包两个架构都能装，同一份给 darwin-aarch64 和 darwin-x86_64；改成带版本号的名字，Release 附件里认得出
            name="Board_${ver}_universal.app.tar.gz"
            for key in darwin-aarch64-app darwin-x86_64-app; do
              mkdir -p "updater/${key}"
              cp "${f}" "updater/${key}/${name}"
              cp "${f}.sig" "updater/${key}/${name}.sig"
            done
          else
            f=$(find "${rel}/nsis" -maxdepth 1 -type f -name "*-setup.exe" 2>/dev/null | head -1)
            need "${f}" "没有 Windows 更新包（NSIS 安装包和 .sig）：构建时要有签名私钥"
            mkdir -p updater/windows-x86_64-nsis
            cp "${f}" "${f}.sig" updater/windows-x86_64-nsis/
          fi
          find updater -type f

      # 更新清单：版本号和 tag 一致，说明是 CHANGELOG.md 里这一版的一段，地址指向这个 Release 的附件
      - name: 生成更新清单 latest.json
        shell: bash
        run: |
          set -euo pipefail
          ver=${GITHUB_REF_NAME#v}
          base="https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME"
          # 两个平台的清单各写一份（内容不一样：各自只含自己的平台），release 时合并成一份 latest.json
          node scripts/updater-manifest.mjs --dir updater --version "$ver" --base "$base" --out "latest-$RUNNER_OS.json" --partial
          # 清单里每个平台都指向这个 Release 的附件，附件的文件名得和上传的一致
          node -e '
            const m = JSON.parse(require("fs").readFileSync("latest-" + process.env.RUNNER_OS + ".json", "utf8"));
            const fs = require("fs");
            const names = new Set();
            for (const d of fs.readdirSync("updater")) for (const n of fs.readdirSync("updater/" + d)) names.add(n);
            for (const [k, p] of Object.entries(m.platforms)) {
              const n = decodeURIComponent(new URL(p.url).pathname.split("/").pop());
              if (!names.has(n)) { console.error(`::error::${k} 的 ${n} 不在上传的更新包里`); process.exit(1); }
            }
            console.log(JSON.stringify(m, null, 2));
          '

      # macOS 挂载 .dmg 核对里面的 Board.app（用户装的是 dmg 里的这一份）；
      # Windows 核对打进安装包的 board.exe
      - name: 核对安装包里的 board 能运行
        shell: bash
        run: |
          want="board ${GITHUB_REF_NAME#v}"
          if [ "$RUNNER_OS" = macOS ]; then
            mnt=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" target/universal-apple-darwin/release/bundle/dmg/*.dmg
            bin="$mnt/Board.app/Contents/MacOS/board"
            lipo -info "$bin" "$mnt/Board.app/Contents/MacOS/board-desktop"
            codesign --verify --deep "$mnt/Board.app"
          else
            bin=target/x86_64-pc-windows-msvc/release/board.exe
          fi
          got=$("$bin" --version)
          [ "$RUNNER_OS" = macOS ] && hdiutil detach "$mnt"
          echo "$got"
          [ "$got" = "$want" ] || { echo "::error::安装包里的 board 版本是「${got}」，应为 $want"; exit 1; }

      # Windows 另打免安装的便携版（绿色版）：安装包要跑安装器，便携版把运行需要的文件直接压成 zip，
      # 解压到任意目录就能运行 board-desktop.exe；内容就是安装版装进安装目录的那几样
      - name: 打包 Windows 便携版（免安装 zip）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = 'target/x86_64-pc-windows-msvc/release'
          $stage = "$rel/bundle/portable/Board"
          New-Item -ItemType Directory -Force $stage | Out-Null
          # 安装版放进安装目录的文件：桌面端、自带的 board 命令行，加上有才有的 WebView2Loader.dll、resources
          foreach ($f in 'board-desktop.exe', 'board.exe') { Copy-Item "$rel/$f" $stage }
          foreach ($f in 'WebView2Loader.dll', 'resources') {
            if (Test-Path "$rel/$f") { Copy-Item "$rel/$f" $stage -Recurse }
          }
          $readme = @'
          Board 便携版（免安装）

          解压到任意目录后直接运行 board-desktop.exe，无需安装。

          - 依赖系统自带的 WebView2 运行时（Windows 10 1803+ / Windows 11 一般已自带）；没有时先装
            Microsoft Edge WebView2 Runtime，或改用会自动下载 WebView2 的安装版（NSIS .exe）。
          - 要在终端里用自带的 board 命令行：把本目录加入 PATH 环境变量（安装版会自动写 PATH）。
          '@
          Set-Content -LiteralPath "$stage/使用说明.txt" -Value $readme -Encoding utf8
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          $zip = "$rel/bundle/Board_${ver}_x64_portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          # 核对：zip 条目齐全，解压出来的 board --version 是 tag 的版本号
          $check = Join-Path $env:RUNNER_TEMP 'portable-check'
          if (Test-Path $check) { Remove-Item $check -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $check
          (Get-ChildItem $check).Name
          $got = & "$check/board.exe" --version
          $want = "board $ver"
          if ($got -ne $want) { throw "便携版里的 board 版本是「${got}」，应为 $want" }
          Write-Host "✓ 便携版：$zip"

      # 更新包（updater/ 原样保留子目录，macOS、Windows 两边各出各的平台键）、各自的清单 latest-<系统>.json（release 时合并）
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            ${{ matrix.files }}
            updater/**
            latest-*.json
          if-no-files-found: error

  # 推 v* tag：构建并推镜像
  build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 核对 tag、Cargo.toml 的版本号和 CHANGELOG.md
        id: version
        run: |
          tag=${GITHUB_REF_NAME#v}
          ver=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME 和 Cargo.toml 的 workspace.package.version（${ver:-取不到}）不一致，不部署。用 npm run release -- $tag 发版"
            exit 1
          fi
          if ! grep -Eq "^## v$ver( |\$)" CHANGELOG.md 2>/dev/null; then
            echo "::error::CHANGELOG.md 里没有 v$ver 一节，不部署。用 npm run release -- $ver 发版（会从提交生成 changelog）"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "构建 ${GITHUB_REF_NAME}：版本 ${ver}，提交 $(git rev-parse --short=7 HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # 用固定的共享 key 取代按任务名的 key，让 tag 上的 build 能读到 main 上 test 保存的缓存
          shared-key: board

      - name: 安装依赖（postinstall 会装 web/ 的依赖）
        run: npm ci

      - name: 构建界面
        run: npm run build:web

      - name: 测试
        run: cargo test --locked

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.13.0

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-zigbuild

      - name: 交叉编译 board-server
        run: ./deploy/build-linux.sh
        env:
          BOARD_COMMIT: ${{ steps.version.outputs.commit }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: prebuilt
          push: true
          # 不生成 provenance / SBOM：每次推送在 GHCR 上只占一个版本，保留 5 个版本就是 5 次部署
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.commit }}
            ${{ env.IMAGE }}:latest

      - name: GHCR 只保留最新 5 个版本
        uses: actions/delete-package-versions@v5
        with:
          package-name: board-server
          package-type: container
          min-versions-to-keep: 5

  deploy:
    needs: build
    # 推 tag 且 build 成功；或者在 main 上手动回滚（build 被跳过）
    if: >-
      always() &&
      ((needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v')) ||
       (needs.build.result == 'skipped' && github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' && github.event.inputs.commit != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      DIR: ${{ vars.DEPLOY_DIR }}
      URL: ${{ vars.DEPLOY_URL }}
    steps:
      # 只用到 docker-compose.yml 和 deploy/ 下的脚本（推 tag 时用 tag 里的版本，回滚时用 main 当前的版本）
      - uses: actions/checkout@v4

      - name: 要部署的提交号
        id: commit
        env:
          INPUT: ${{ github.event.inputs.commit }}
          BUILT: ${{ needs.build.outputs.commit }}
        run: |
          c=${INPUT:-$BUILT}
          echo "$c" | grep -Eq '^[0-9a-f]{7}$' || { echo "::error::提交号格式不对：${c}（要 7 位小写十六进制）"; exit 1; }
          echo "commit=$c" >> "$GITHUB_OUTPUT"
          echo "部署 $IMAGE:$c → $HOST:${DIR}（${URL}）"

      - name: 配置 SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          [ -n "$HOST" ] && [ -n "$DIR" ] && [ -n "$URL" ] || { echo "::error::没有设置 DEPLOY_HOST / DEPLOY_DIR / DEPLOY_URL"; exit 1; }
          [ -n "$KEY" ] && [ -n "$KNOWN" ] || { echo "::error::没有设置 DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          # 严格校验主机密钥：服务器的主机密钥必须在 DEPLOY_KNOWN_HOSTS 里
          cat > ~/.ssh/config <<'EOF'
          Host *
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
            ConnectTimeout 15
          EOF

      - name: 拷贝 compose 和脚本到服务器
        run: |
          ssh "$HOST" "mkdir -p '$DIR/deploy'"
          scp -q docker-compose.yml "$HOST:$DIR/docker-compose.yml"
          scp -q deploy/backup.sh deploy/remote-deploy.sh "$HOST:$DIR/deploy/"
          ssh "$HOST" "chmod +x '$DIR/deploy/backup.sh' '$DIR/deploy/remote-deploy.sh'"

      - name: 备份、拉镜像、重启、等健康检查
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          ACTOR: ${{ github.actor }}
        # 令牌走 stdin，不出现在命令行和日志里
        run: printf '%s' "$TOKEN" | ssh "$HOST" "cd '$DIR' && ./deploy/remote-deploy.sh deploy '$COMMIT' '$ACTOR'"

      - name: 核对线上版本号和提交号
        env:
          COMMIT: ${{ steps.commit.outputs.commit }}
          # 回滚时没有版本号，只核对提交号
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          got=; gotv=
          for i in $(seq 1 12); do
            h=$(curl -fsS --max-time 15 "${URL%/}/api/health?t=$(date +%s)" 2>/dev/null || true)
            got=$(printf '%s' "$h" | jq -r '.commit // empty' 2>/dev/null || true)
            gotv=$(printf '%s' "$h" | jq -r '.version // empty' 2>/dev/null || true)
            if [ "$got" = "$COMMIT" ] && { [ -z "$VERSION" ] || [ "$gotv" = "$VERSION" ]; }; then
              echo "✓ 线上 $URL 是 ${gotv:-?}（${got}）"
              exit 0
            fi
            sleep 5
          done
          echo "::error::线上 $URL 是「${gotv:-取不到}（${got:-取不到}）」，应为 ${VERSION:-任意版本}（${COMMIT}），切回部署前的镜像"
          ssh "$HOST" "cd '$DIR' && ./deploy/remote-deploy.sh rollback"
          exit 1

      - name: 清理旧镜像
        run: ssh "$HOST" "cd '$DIR' && ./deploy/remote-deploy.sh cleanup"

      - name: 删除部署密钥
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # 部署成功、skill 打包成功、两个平台的桌面端安装包和更新清单都构建成功后，用 CHANGELOG.md 里这一版的段落建 GitHub Release，
  # 附上 board-skills.zip、桌面端安装包、更新包和 latest.json（桌面端的「检查更新」读它）
  release:
    needs: [build, deploy, skill, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: board-skills

      - uses: actions/download-artifact@v4
        with:
          name: board-cli
          path: board-cli

      # 单独的 board 包缺平台、或校验文件对不上就不建 Release：安装脚本按版本号下载它们
      - name: 核对单独的 board 包
        run: |
          cd board-cli
          for p in darwin-arm64.tar.gz darwin-x64.tar.gz linux-x64.tar.gz linux-arm64.tar.gz windows-x64.zip; do
            [ -f "board-$p" ] || { echo "::error::缺少 board-$p"; exit 1; }
          done
          sha256sum -c board-sha256.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop
          merge-multiple: true

      # 两个平台各写了一份清单（各自的项目）：合并成一份 latest.json，三个平台的更新包都得在
      # （macOS 两个架构、Windows x64），缺任何一个不建 Release——桌面端只认这一份清单；
      # windows-x86_64 是 Windows 免安装/开发版的回退键，和 windows-x86_64-nsis 指向同一个包，不能丢
      - name: 合并更新清单 latest.json
        run: |
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync("desktop").filter(n => /^latest-.*\.json$/.test(n));
            if (files.length < 2) { console.error("::error::没有两个平台的更新清单（latest-*.json）：" + files.join("、")); process.exit(1); }
            const out = { platforms: {} };
            for (const n of files) {
              const m = JSON.parse(fs.readFileSync("desktop/" + n, "utf8"));
              if (out.version && m.version !== out.version) { console.error("::error::两个平台的清单版本号不一样：" + out.version + " / " + m.version); process.exit(1); }
              out.version = m.version; out.notes = m.notes; out.pub_date = m.pub_date;
              Object.assign(out.platforms, m.platforms);
            }
            const need = ["darwin-aarch64-app", "darwin-x86_64-app", "windows-x86_64-nsis", "windows-x86_64"];
            const missing = need.filter(k => !out.platforms[k]);
            if (missing.length) { console.error("::error::更新清单缺少平台：" + missing.join("、")); process.exit(1); }
            const names = new Set();
            const walk = d => { for (const e of fs.readdirSync(d, { withFileTypes: true })) e.isDirectory() ? walk(d + "/" + e.name) : names.add(e.name); };
            walk("desktop");
            for (const [k, p] of Object.entries(out.platforms)) {
              const n = decodeURIComponent(new URL(p.url).pathname.split("/").pop());
              if (!names.has(n)) { console.error(`::error::${k} 的 ${n} 不在这个 Release 的附件里`); process.exit(1); }
            }
            fs.writeFileSync("latest.json", JSON.stringify(out, null, 2) + "\n");
            console.log(JSON.stringify(out, null, 2));
          '

      - name: 建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v h="## v$VERSION" 'index($0, h" ") == 1 || $0 == h { f = 1; next } f && /^## / { exit } f' CHANGELOG.md | sed '/./,$!d' > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md 里取不到 v$VERSION 一节"; exit 1; }
          # 上传时按 glob 的公共目录保留子目录：macOS 的 .dmg、Windows 的便携版 .zip 在最外层，Windows 的 .exe / .msi 在 nsis/、msi/ 下面；
          # 更新包（updater/）和最新清单 latest.json 也一起附上——桌面端的「检查更新」读 releases/latest/download/latest.json
          # 同名的只附一次：macOS 通用更新包给两个架构各收了一份，Windows 的更新包就是 nsis/ 下的安装包；
          # 同名但内容不同说明收错了，不建 Release（gh 也不允许同名附件）
          files=()
          while IFS= read -r f; do
            dup=""
            for g in ${files[@]+"${files[@]}"}; do
              [ "$(basename "$g")" = "$(basename "$f")" ] && { dup=$g; break; }
            done
            if [ -n "$dup" ]; then
              cmp -s "$dup" "$f" || { echo "::error::两个同名的附件内容不同：${dup} / ${f}"; exit 1; }
              continue
            fi
            files+=("$f")
          done < <(find desktop -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.zip' -o -name '*.app.tar.gz' \) | sort)
          for ext in dmg exe msi zip app.tar.gz; do
            printf '%s\n' "${files[@]}" | grep -q "\.$ext$" || { echo "::error::缺少桌面端安装包（.${ext}，更新包），不建 Release"; exit 1; }
          done
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Board $GITHUB_REF_NAME" --notes-file notes.md board-skills.zip latest.json board-cli/* "${files[@]}"
