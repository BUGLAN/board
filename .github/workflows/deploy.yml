# 测试与部署（docs/deploy.md「自动部署」）：
#   push main   → test：npm ci → cargo test → 界面类型检查 → 界面单元测试；不部署
#               → heartbeat-windows：在 Windows 上跑 board heartbeat 的测试（启动不卡死、agent 退出后停下、stop 发 final），
#                 以及多行正文经过 skill 入口 board.cmd 一字不丢（tests/multiline.rs）
#   push tag v*  → skill：在 macOS 上编各平台的 board，放进 skill 的 bin/，打包 board-skills.zip（和 build、deploy 同时跑）
#                → desktop：在 macOS、Windows 上构建桌面端安装包（macOS 通用 .dmg；Windows NSIS .exe 和 .msi），和 build、deploy 同时跑
#                → build：核对 tag、Cargo.toml 的 workspace 版本号和 CHANGELOG.md → 构建界面、cargo test、交叉编译 board-server、prebuilt 镜像推到 GHCR
#                → deploy：SSH 到服务器备份、拉镜像、改 .env 的 BOARD_IMAGE、重启，核对线上版本号和提交号；失败切回上一个镜像
#                → release：用 CHANGELOG.md 里这一版的段落建 GitHub Release，附上 board-skills.zip 和桌面端安装包
#                  （任一平台的安装包没构建出来就不建 Release，不留残缺的附件；服务端照常部署）
# tag 由 npm run release 打（scripts/release.mjs：改版本号、生成 changelog、提交、打 tag）
# 手动运行（在 main 上）填 7 位提交号：跳过 build，直接部署 GHCR 上已有的镜像（回滚用）
name: deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
    # 推 main 时改动全部在这些路径里不跑测试（推 tag 不看路径）
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      commit:
        description: "要回滚到的 7 位提交号：跳过构建，直接部署 GHCR 上已有的镜像"
        required: true

# 部署同一时间只有一次：后来的排队，不取消正在进行的；测试另排一队
concurrency:
  group: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && 'deploy' || 'test' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/buglan/board-server

jobs:
  # 推 main：只跑推送前检查（和 AGENTS.md 一致），不构建镜像、不部署
  test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # 用固定的共享 key 取代按任务名的 key，让 tag 上的 build 能读到 main 上 test 保存的缓存
          shared-key: board

      - name: 安装依赖（postinstall 会装 web/ 的依赖）
        run: npm ci

      - name: 测试
        run: cargo test --locked

      - name: 界面类型检查
        run: npm --prefix web run typecheck

      - name: 界面单元测试
        run: npm --prefix web test

  # 推 main：后台心跳在 Windows 上的行为（tests/heartbeat.rs）、多行正文经过 board.cmd（tests/multiline.rs），Linux 上的已经在 test 里跑过
  heartbeat-windows:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # 用固定的共享 key 取代按任务名的 key，让 tag 上的 build 能读到 main 上 test 保存的缓存
          shared-key: board

      - name: board heartbeat、多行正文经过 board.cmd 的测试
        run: cargo test --locked -p board-cli --test heartbeat --test agents --test multiline

  # 推 v* tag：编各平台的 board 放进 skill 目录，打包成 board-skills.zip，release 时附上
  skill:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # 用固定的共享 key 取代按任务名的 key，让 tag 上的 build 能读到 main 上 test 保存的缓存
          shared-key: board

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.13.0

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-zigbuild

      - name: 编各平台的 board，打包 skill
        run: node scripts/build-skill-bin.mjs --zip

      - uses: actions/upload-artifact@v4
        with:
          name: board-skills
          path: target/board-skills.zip
          if-no-files-found: error

  # 推 v* tag：从 tag 对应的提交构建桌面端安装包（界面 + 自带的 board 命令行），release 时附上。
  # 不签名、不公证：macOS 用 ad-hoc 签名（Apple Silicon 上才能运行），第一次打开要在「隐私与安全性」里放行（docs/deploy.md「桌面端安装包」）
  desktop:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      # 一个平台失败不取消另一个，日志都留着；release 需要两个都成功
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
            files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
            files: |
              target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 核对 tag 和 tauri.conf.json 的版本号
        shell: bash
        run: |
          tag=${GITHUB_REF_NAME#v}
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME 和 src-tauri/tauri.conf.json 的版本号（$ver）不一致。用 npm run release -- $tag 发版"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: board-desktop

      - name: 安装依赖（postinstall 会装 web/ 的依赖）
        run: npm ci

      # 编 board 放进 src-tauri/binaries（通用包时编两个架构再 lipo）。beforeBuildCommand 还会再跑一次，已经编好的不重编
      - name: 编安装包自带的 board
        run: node scripts/build-sidecar.mjs
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}

      # beforeBuildCommand 构建界面
      - name: 构建安装包
        run: npx tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          # macOS：ad-hoc 签名；Windows 上不用
          APPLE_SIGNING_IDENTITY: "-"

      # macOS 挂载 .dmg 核对里面的 Board.app（只打 dmg 时 Tauri 打完包会删掉 bundle/macos 下的 .app）；
      # Windows 核对打进安装包的 board.exe
      - name: 核对安装包里的 board 能运行
        shell: bash
        run: |
          want="board ${GITHUB_REF_NAME#v}"
          if [ "$RUNNER_OS" = macOS ]; then
            mnt=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" target/universal-apple-darwin/release/bundle/dmg/*.dmg
            bin="$mnt/Board.app/Contents/MacOS/board"
            lipo -info "$bin" "$mnt/Board.app/Contents/MacOS/board-desktop"
            codesign --verify --deep "$mnt/Board.app"
          else
            bin=target/x86_64-pc-windows-msvc/release/board.exe
          fi
          got=$("$bin" --version)
          [ "$RUNNER_OS" = macOS ] && hdiutil detach "$mnt"
          echo "$got"
          [ "$got" = "$want" ] || { echo "::error::安装包里的 board 版本是「$got」，应为 $want"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # 推 v* tag：构建并推镜像
  build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 核对 tag、Cargo.toml 的版本号和 CHANGELOG.md
        id: version
        run: |
          tag=${GITHUB_REF_NAME#v}
          ver=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME 和 Cargo.toml 的 workspace.package.version（${ver:-取不到}）不一致，不部署。用 npm run release -- $tag 发版"
            exit 1
          fi
          if ! grep -Eq "^## v$ver( |\$)" CHANGELOG.md 2>/dev/null; then
            echo "::error::CHANGELOG.md 里没有 v$ver 一节，不部署。用 npm run release -- $ver 发版（会从提交生成 changelog）"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "构建 $GITHUB_REF_NAME：版本 $ver，提交 $(git rev-parse --short=7 HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # 用固定的共享 key 取代按任务名的 key，让 tag 上的 build 能读到 main 上 test 保存的缓存
          shared-key: board

      - name: 安装依赖（postinstall 会装 web/ 的依赖）
        run: npm ci

      - name: 构建界面
        run: npm run build:web

      - name: 测试
        run: cargo test --locked

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.13.0

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-zigbuild

      - name: 交叉编译 board-server
        run: ./deploy/build-linux.sh
        env:
          BOARD_COMMIT: ${{ steps.version.outputs.commit }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: prebuilt
          push: true
          # 不生成 provenance / SBOM：每次推送在 GHCR 上只占一个版本，保留 5 个版本就是 5 次部署
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.commit }}
            ${{ env.IMAGE }}:latest

      - name: GHCR 只保留最新 5 个版本
        uses: actions/delete-package-versions@v5
        with:
          package-name: board-server
          package-type: container
          min-versions-to-keep: 5

  deploy:
    needs: build
    # 推 tag 且 build 成功；或者在 main 上手动回滚（build 被跳过）
    if: >-
      always() &&
      ((needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v')) ||
       (needs.build.result == 'skipped' && github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' && github.event.inputs.commit != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      DIR: ${{ vars.DEPLOY_DIR }}
      URL: ${{ vars.DEPLOY_URL }}
    steps:
      # 只用到 docker-compose.yml 和 deploy/ 下的脚本（推 tag 时用 tag 里的版本，回滚时用 main 当前的版本）
      - uses: actions/checkout@v4

      - name: 要部署的提交号
        id: commit
        env:
          INPUT: ${{ github.event.inputs.commit }}
          BUILT: ${{ needs.build.outputs.commit }}
        run: |
          c=${INPUT:-$BUILT}
          echo "$c" | grep -Eq '^[0-9a-f]{7}$' || { echo "::error::提交号格式不对：${c}（要 7 位小写十六进制）"; exit 1; }
          echo "commit=$c" >> "$GITHUB_OUTPUT"
          echo "部署 $IMAGE:$c → $HOST:$DIR（$URL）"

      - name: 配置 SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          [ -n "$HOST" ] && [ -n "$DIR" ] && [ -n "$URL" ] || { echo "::error::没有设置 DEPLOY_HOST / DEPLOY_DIR / DEPLOY_URL"; exit 1; }
          [ -n "$KEY" ] && [ -n "$KNOWN" ] || { echo "::error::没有设置 DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          # 严格校验主机密钥：服务器的主机密钥必须在 DEPLOY_KNOWN_HOSTS 里
          cat > ~/.ssh/config <<'EOF'
          Host *
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
            ConnectTimeout 15
          EOF

      - name: 拷贝 compose 和脚本到服务器
        run: |
          ssh "$HOST" "mkdir -p '$DIR/deploy'"
          scp -q docker-compose.yml "$HOST:$DIR/docker-compose.yml"
          scp -q deploy/backup.sh deploy/remote-deploy.sh "$HOST:$DIR/deploy/"
          ssh "$HOST" "chmod +x '$DIR/deploy/backup.sh' '$DIR/deploy/remote-deploy.sh'"

      - name: 备份、拉镜像、重启、等健康检查
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          ACTOR: ${{ github.actor }}
        # 令牌走 stdin，不出现在命令行和日志里
        run: printf '%s' "$TOKEN" | ssh "$HOST" "cd '$DIR' && ./deploy/remote-deploy.sh deploy '$COMMIT' '$ACTOR'"

      - name: 核对线上版本号和提交号
        env:
          COMMIT: ${{ steps.commit.outputs.commit }}
          # 回滚时没有版本号，只核对提交号
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          got=; gotv=
          for i in $(seq 1 12); do
            h=$(curl -fsS --max-time 15 "${URL%/}/api/health?t=$(date +%s)" 2>/dev/null || true)
            got=$(printf '%s' "$h" | jq -r '.commit // empty' 2>/dev/null || true)
            gotv=$(printf '%s' "$h" | jq -r '.version // empty' 2>/dev/null || true)
            if [ "$got" = "$COMMIT" ] && { [ -z "$VERSION" ] || [ "$gotv" = "$VERSION" ]; }; then
              echo "✓ 线上 $URL 是 ${gotv:-?}（$got）"
              exit 0
            fi
            sleep 5
          done
          echo "::error::线上 $URL 是「${gotv:-取不到}（${got:-取不到}）」，应为 ${VERSION:-任意版本}（$COMMIT），切回部署前的镜像"
          ssh "$HOST" "cd '$DIR' && ./deploy/remote-deploy.sh rollback"
          exit 1

      - name: 清理旧镜像
        run: ssh "$HOST" "cd '$DIR' && ./deploy/remote-deploy.sh cleanup"

      - name: 删除部署密钥
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # 部署成功、skill 打包成功、两个平台的桌面端安装包都构建成功后，用 CHANGELOG.md 里这一版的段落建 GitHub Release，
  # 附上 board-skills.zip 和桌面端安装包
  release:
    needs: [build, deploy, skill, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: board-skills

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop
          merge-multiple: true

      - name: 建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v h="## v$VERSION" 'index($0, h" ") == 1 || $0 == h { f = 1; next } f && /^## / { exit } f' CHANGELOG.md | sed '/./,$!d' > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md 里取不到 v$VERSION 一节"; exit 1; }
          ls desktop/*.dmg desktop/*.exe desktop/*.msi >/dev/null || { echo "::error::缺少桌面端安装包，不建 Release"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Board $GITHUB_REF_NAME" --notes-file notes.md board-skills.zip desktop/*
